<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>عضویت | صندوق قرض‌الحسنه امام رضا (ع)</title>
  <link rel="stylesheet" href="css/site.css" />
  <link rel="icon" href="images/logo.png" />
</head>
<body>
  <div class="page">
    <div class="site-header">
      <a class="brand-lockup" href="index.html">
        <img src="images/logo.png" alt="لوگو" />
        <div class="titles">
          <strong>صندوق قرض‌الحسنه امام رضا (ع)</strong>
          <span>فرم عضویت</span>
        </div>
      </a>
      <div class="nav"><a href="index.html"><i class="fas fa-home"></i>خانه</a><a href="login.html"><i class="fas fa-sign-in-alt"></i>ورود</a></div>
    </div>
    <div class="card">
      <h2><i class="fas fa-user-plus icon-green"></i>فرم عضویت</h2>
      <p><i class="fas fa-info-circle icon-green"></i> اپلیکیشن <span class="bale-inline bale-inline--md"><img src="images/bale-logo.svg" alt="" class="bale-logo" />بله</span> اجباری است. پس از ثبت‌نام، ربات را Start کنید تا Chat ID ذخیره و رمز عبور در <span class="bale-inline bale-inline--md"><img src="images/bale-logo.svg" alt="" class="bale-logo" />بله</span> ارسال شود.</p>
      <div class="row">
        <div><label><i class="fas fa-id-badge"></i>کد ملی</label><input id="nationalCode" maxlength="10" /></div>
        <div><label><i class="fas fa-mobile-alt"></i>شماره موبایل</label><input id="mobile" maxlength="11" placeholder="09xxxxxxxxx" /></div>
      </div>
      <div class="row">
        <div><label><i class="fas fa-user"></i>نام</label><input id="firstName" /></div>
        <div><label><i class="fas fa-user"></i>نام خانوادگی</label><input id="lastName" /></div>
      </div>
      <div>
        <label><i class="fas fa-users"></i>نوع عضویت</label>
        <select id="roleType">
          <option value="2">وام‌گیرنده / عضو</option>
          <option value="3">خیر (کمک‌کننده)</option>
        </select>
      </div>
      <div id="donationBox" style="display:none">
        <label><i class="fas fa-hand-holding-heart"></i>مبلغ کمک ماهانه (ریال)</label>
        <input id="monthlyDonationAmount" type="text" class="amount-input" inputmode="numeric" placeholder="مثال: 500,000" />
      </div>
      <label><input type="checkbox" id="hasBaleApp" checked /> <span class="bale-inline bale-inline--md"><img src="images/bale-logo.svg" alt="" class="bale-logo" />اپلیکیشن بله</span> را نصب دارم (اجباری)</label>
      <button type="button" class="btn primary block" id="btnRegister"><i class="fas fa-check"></i>ثبت عضویت</button>
      <div id="msg" class="msg"></div>
      <div id="baleBox" class="card" style="display:none;margin-top:1rem;box-shadow:none">
        <h2><span class="bale-inline bale-inline--md"><img src="images/bale-logo.svg" alt="" class="bale-logo" />اتصال به ربات بله</span></h2>
        <p id="baleHelp"></p>
        <p><a id="botLink" class="btn primary" target="_blank" rel="noopener"><img src="images/bale-logo.svg" alt="" class="bale-btn-logo" />باز کردن ربات بله و Start</a></p>
        <button type="button" class="btn dark" id="btnPoll"><i class="fas fa-sync-alt"></i>بررسی اتصال <span class="bale-inline"><img src="images/bale-logo.svg" alt="" class="bale-logo" />بله</span></button>
        <div id="pollMsg" class="msg"></div>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    GoodLoan.ready(function () {
      const G = GoodLoan;
      G.$('roleType').addEventListener('change', function () {
        G.$('donationBox').style.display = G.$('roleType').value === '3' ? 'block' : 'none';
      });

      G.bindAmountInputs('.amount-input');

      G.bindClick('btnRegister', async function () {
        const btn = G.$('btnRegister');
        btn.disabled = true;
        const donation = G.getAmountValue('monthlyDonationAmount');
        const { data } = await G.post('/api/user/register', {
          nationalCode: G.$('nationalCode').value.trim(),
          mobile: G.$('mobile').value.trim(),
          firstName: G.$('firstName').value.trim(),
          lastName: G.$('lastName').value.trim(),
          roleType: Number(G.$('roleType').value),
          hasBaleApp: G.$('hasBaleApp').checked,
          monthlyDonationAmount: donation > 0 ? donation : null
        });
        btn.disabled = false;
        G.showMsg(G.$('msg'), data.message || 'خطا در ثبت‌نام', data.success);
        if (!data.success) return;

        const info = data.data || {};
        const userId = G.pick(info, 'userId');
        if (userId) localStorage.setItem('gl_userId', userId);

        G.$('baleBox').style.display = 'block';
        if (G.pick(info, 'passwordUntilBaleConnected')) {
          G.$('baleHelp').textContent = 'رمز موقت تا اتصال بله: ' + G.pick(info, 'passwordUntilBaleConnected');
        } else {
          G.$('baleHelp').textContent = 'روی لینک زیر بزنید و Start را بزنید.';
        }
        const botLink = G.pick(info, 'botLink');
        if (botLink) {
          G.$('botLink').href = botLink;
          G.$('botLink').style.display = 'inline-flex';
        } else {
          G.$('botLink').style.display = 'none';
          G.$('baleHelp').textContent += ' (نام کاربری ربات در تنظیمات وارد نشده — کد ملی را برای ربات بفرستید.)';
        }
      });

      G.bindClick('btnPoll', async function () {
        const { data } = await G.post('/api/bale/poll', {});
        G.showMsg(G.$('pollMsg'), data.message || 'خطا', data.success);
      });
    });
  </script>
</body>
</html>
