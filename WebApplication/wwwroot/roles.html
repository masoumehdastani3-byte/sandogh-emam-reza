<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>نقش‌ها و دسترسی منو | لبخند فردا</title>
  <link rel="stylesheet" href="css/site.css?v=20261117f" />
  <link rel="icon" href="images/labkhand-logo.png" />
</head>
<body class="admin-page">
  <div class="page">
    <div class="site-header" data-brand-header data-title="نقش‌ها و دسترسی منو" data-links="home,panel"></div>

    <div id="adminNavBar" class="admin-nav-bar"></div>

    <div id="accessDenied" data-access-denied data-return="roles.html" style="display:none"></div>

    <div id="rolesContent" style="display:none">
      <div class="tab-menu admin-subnav">
        <button type="button" class="tab-btn" data-tab="tab-roles"><i class="fas fa-users-cog"></i>نقش‌ها و دسترسی</button>
        <button type="button" class="tab-btn" data-tab="tab-menus"><i class="fas fa-bars"></i>تعریف منو</button>
      </div>

      <div class="card tab-panel" id="tab-roles">
        <div class="roles-layout">
          <div>
            <h3><i class="fas fa-user-tag icon-green"></i>نقش‌ها</h3>
            <ul class="role-list" id="roleList"></ul>
            <hr />
            <label>نام نقش جدید</label>
            <input id="newRoleName" placeholder="مثلاً کارشناس" />
            <label>توضیحات</label>
            <input id="newRoleDesc" />
            <button type="button" class="btn primary block" id="btnAddRole"><i class="fas fa-plus"></i>افزودن نقش</button>
          </div>
          <div>
            <h3><i class="fas fa-key icon-green"></i>دسترسی منو برای: <span id="selectedRoleName">—</span></h3>
            <p id="selectedRoleMeta" class="lead">یک نقش را از لیست انتخاب کنید.</p>
            <div class="menu-grid" id="menuGrid"></div>
            <div class="actions">
              <button type="button" class="btn dark" id="btnSaveAccess" disabled><i class="fas fa-save"></i>ذخیره دسترسی‌ها</button>
              <button type="button" class="btn danger" id="btnDeleteRole" disabled><i class="fas fa-trash"></i>حذف نقش</button>
            </div>
          </div>
        </div>
        <div id="msg" class="msg"></div>
      </div>

      <div class="card tab-panel" id="tab-menus">
        <h2><i class="fas fa-bars icon-green"></i>تعریف منوی جدید</h2>
        <div class="row">
          <div><label>عنوان منو</label><input id="menuTitle" placeholder="پنل گزارش‌ها" /></div>
          <div><label>آدرس صفحه</label><input id="menuUrl" placeholder="reports.html" /></div>
        </div>
        <div class="row">
          <div><label>شناسه کنترل</label><input id="menuControlId" placeholder="reports" /></div>
          <div><label>توضیحات</label><input id="menuDesc" /></div>
        </div>
        <button type="button" class="btn primary block" id="btnAddMenu"><i class="fas fa-plus"></i>افزودن منو</button>
        <div id="menuMsg" class="msg"></div>
        <h3>منوهای موجود</h3>
        <div class="table-scroll"><table><thead><tr><th>شناسه</th><th>عنوان</th><th>آدرس</th><th>کنترل</th></tr></thead><tbody id="menuTableBody"></tbody></table></div>
      </div>
    </div>
  </div>
  <script src="js/app.js?v=20261117f"></script>
  <script>
    GoodLoan.ready(async function () {
      const G = GoodLoan;
      const managerId = await G.requireManager();
      if (!managerId) {
        G.$('accessDenied').style.display = 'block';
        return;
      }

      G.$('rolesContent').style.display = 'block';
      G.renderAdminNav('adminNavBar', { page: 'roles' });
      G.initTabs('tab-roles');
      G.initPageTables('#rolesContent');

      let roles = [];
      let menus = [];
      let selectedRoleId = 0;
      let selectedMenuIds = [];

      function renderRoles() {
        G.$('roleList').innerHTML = roles.map(function (r) {
          const active = Number(G.pick(r, 'roleId')) === selectedRoleId ? ' active' : '';
          return '<li class="role-item' + active + '" data-id="' + G.pick(r, 'roleId') + '">' +
            '<div><strong>' + (G.pick(r, 'roleName') || '') + '</strong>' +
            '<small>' + (G.pick(r, 'userCount') || 0) + ' کاربر</small></div>' +
            '<i class="fas fa-chevron-left"></i></li>';
        }).join('');
      }

      function renderMenuGrid() {
        G.$('menuGrid').innerHTML = menus.map(function (m) {
          const id = G.pick(m, 'userSubMenuId');
          const checked = selectedMenuIds.indexOf(id) >= 0 ? ' checked' : '';
          return '<label class="menu-check"><input type="checkbox" class="menu-cb" value="' + id + '"' + checked + ' />' +
            '<div><strong>' + (G.pick(m, 'menuTitle') || '') + '</strong>' +
            '<span>' + (G.pick(m, 'selectorID') || '') + '</span></div></label>';
        }).join('');
      }

      function renderMenuTable() {
        G.$('menuTableBody').innerHTML = menus.map(function (m) {
          return '<tr><td>' + G.pick(m, 'userSubMenuId') + '</td><td>' + (G.pick(m, 'menuTitle') || '') + '</td><td>' + (G.pick(m, 'selectorID') || '') + '</td><td>' + (G.pick(m, 'controlID') || '') + '</td></tr>';
        }).join('');
        G.refreshDataTable('menuTableBody');
      }

      function selectRole(roleId) {
        selectedRoleId = roleId;
        const role = roles.find(function (r) { return Number(G.pick(r, 'roleId')) === roleId; });
        if (!role) return;
        selectedMenuIds = (G.pick(role, 'menuIds') || []).map(Number);
        G.$('selectedRoleName').textContent = G.pick(role, 'roleName') || '';
        G.$('selectedRoleMeta').textContent = (G.pick(role, 'description') || 'بدون توضیح') + ' — ' + (G.pick(role, 'userCount') || 0) + ' کاربر';
        G.$('btnSaveAccess').disabled = false;
        G.$('btnDeleteRole').disabled = Number(G.pick(role, 'userCount')) > 0;
        renderRoles();
        renderMenuGrid();
      }

      async function load() {
        const r = await G.get('/api/roles?managerUserId=' + managerId);
        const m = await G.get('/api/roles/menus?managerUserId=' + managerId);
        roles = G.payload(r) || [];
        menus = G.payload(m) || [];
        if (!selectedRoleId && roles.length) selectRole(Number(G.pick(roles[0], 'roleId')));
        else renderRoles();
        renderMenuGrid();
        renderMenuTable();
      }

      G.$('roleList').addEventListener('click', function (e) {
        const item = e.target.closest('.role-item');
        if (!item) return;
        selectRole(Number(item.getAttribute('data-id')));
      });

      G.$('menuGrid').addEventListener('change', function (e) {
        if (!e.target.classList.contains('menu-cb')) return;
        const id = Number(e.target.value);
        if (e.target.checked) {
          if (selectedMenuIds.indexOf(id) < 0) selectedMenuIds.push(id);
        } else {
          selectedMenuIds = selectedMenuIds.filter(function (x) { return x !== id; });
        }
      });

      G.bindClick('btnAddRole', async function () {
        const { data } = await G.post('/api/roles', {
          managerUserId: managerId,
          roleName: G.$('newRoleName').value,
          description: G.$('newRoleDesc').value
        });
        G.showMsg(G.$('msg'), data.message || 'خطا', data.success);
        if (!data.success) return;
        G.$('newRoleName').value = '';
        G.$('newRoleDesc').value = '';
        await load();
        if (data.data && data.data.roleId) selectRole(Number(data.data.roleId));
      });

      G.bindClick('btnSaveAccess', async function () {
        if (!selectedRoleId) return;
        const { data } = await G.put('/api/roles/access', {
          managerUserId: managerId,
          roleId: selectedRoleId,
          menuIds: selectedMenuIds
        });
        G.showMsg(G.$('msg'), data.message || 'خطا', data.success);
        if (data.success) load();
      });

      G.bindClick('btnDeleteRole', async function () {
        if (!selectedRoleId) return;
        if (!confirm('این نقش حذف شود؟')) return;
        const result = await G.del('/api/roles/' + selectedRoleId + '?managerUserId=' + managerId);
        G.showMsg(G.$('msg'), result.data.message || 'خطا', result.data.success);
        if (!result.data.success) return;
        selectedRoleId = 0;
        load();
      });

      G.bindClick('btnAddMenu', async function () {
        const { data } = await G.post('/api/roles/menus', {
          managerUserId: managerId,
          menuTitle: G.$('menuTitle').value,
          selectorId: G.$('menuUrl').value,
          controlId: G.$('menuControlId').value,
          description: G.$('menuDesc').value
        });
        G.showMsg(G.$('menuMsg'), data.message || 'خطا', data.success);
        if (!data.success) return;
        G.$('menuTitle').value = '';
        G.$('menuUrl').value = '';
        G.$('menuControlId').value = '';
        G.$('menuDesc').value = '';
        load();
      });

      load();
    });
  </script>
</body>
</html>
