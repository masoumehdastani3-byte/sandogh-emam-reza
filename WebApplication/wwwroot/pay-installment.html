<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>پرداخت قسط | لبخند فردا</title>
  <link rel="stylesheet" href="css/site.css?v=20261114b" />
  <link rel="icon" href="images/labkhand-logo.png" />
  <style>
    .pay-summary {
      margin: 1rem 0;
      padding: 1rem;
      border-radius: .85rem;
      background: var(--brand-green-soft);
      border-right: 3px solid var(--brand-green);
      line-height: 1.9;
    }
    .pay-summary div { display: flex; justify-content: space-between; gap: 1rem; margin: .25rem 0; }
    .pay-summary .total { font-weight: 700; color: var(--brand-green-deep); margin-top: .5rem; padding-top: .5rem; border-top: 1px dashed rgba(0,0,0,.12); }
  </style>
</head>
<body>
  <div class="page">
    <div class="site-header">
      <a class="brand-lockup" href="index.html">
        <img src="images/labkhand-logo.png" alt="لوگو" />
        <div class="titles">
          <span>پرداخت قسط</span>
        </div>
      </a>
    </div>

    <div class="card">
      <h2><i class="fas fa-credit-card icon-green"></i>پرداخت قسط</h2>
      <p class="muted-text" style="margin-top:0">دکمه را بزنید تا صفحه بانک باز شود. لازم نیست وارد سایت شوید.</p>
      <div id="msg" class="msg"></div>
      <div id="content" style="display:none">
        <div class="pay-summary" id="summary"></div>
        <button type="button" class="btn primary block" id="btnPay" style="min-height:56px;font-size:1.15rem"><i class="fas fa-university"></i>رفتن به صفحه بانک</button>
      </div>
      <p class="muted-text" style="margin-top:1rem">بعد از پرداخت، نتیجه در بله می‌آید.</p>
    </div>
  </div>
  <script src="js/app.js?v=20261116c"></script>
  <script>
    GoodLoan.ready(async function () {
      const G = GoodLoan;
      const token = new URLSearchParams(location.search).get('token');
      if (!token) {
        G.showMsg(G.$('msg'), 'لینک پرداخت نامعتبر است', false);
        return;
      }

      const result = await G.get('/api/payment/installment-link?token=' + encodeURIComponent(token));
      if (!result.res.ok || !result.data.success) {
        G.showMsg(G.$('msg'), (result.data && result.data.message) || 'لینک پرداخت معتبر نیست', false);
        return;
      }

      const info = G.payload(result);
      function toman(n) { return G.formatNumber(Math.round(Number(n || 0) / 10)) + ' تومان'; }
      G.$('content').style.display = 'block';
      G.$('summary').innerHTML =
        '<div><span>نام</span><b>' + (G.pick(info, 'memberName') || '') + '</b></div>' +
        '<div><span>سررسید</span><b>' + (G.pick(info, 'dueDate_Shamsi') || '-') + '</b></div>' +
        '<div><span>مبلغ قسط</span><b>' + toman(G.pick(info, 'installmentAmount')) + '</b></div>' +
        '<div><span>کارمزد بانک</span><b>' + toman(G.pick(info, 'gatewayFeeAmount')) + '</b></div>' +
        '<div class="total"><span>مبلغی که می‌پردازید</span><b>' + toman(G.pick(info, 'payableAmount')) + '</b></div>';

      G.bindClick('btnPay', async function () {
        const btn = G.$('btnPay');
        btn.disabled = true;
        const { data } = await G.post('/api/payment/zarinpal/request', {
          payToken: token,
          paymentType: 1,
          description: 'پرداخت قسط از لینک بله'
        });
        btn.disabled = false;
        if (!data.success) {
          G.showMsg(G.$('msg'), data.message || 'خطا در اتصال به درگاه', false);
          return;
        }
        const gatewayUrl = G.pick(data.data, 'gatewayUrl');
        if (gatewayUrl) location.href = gatewayUrl;
      });
    });
  </script>
</body>
</html>
